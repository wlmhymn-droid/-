<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Panic</title>

    <style>
        body {
            margin: 0;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #topbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 8px 12px;
            box-sizing: border-box;
            color: #fff;
        }
        #authArea button {
            background: #4285F4;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        #authArea button:hover { background: #3367D6; }
        #authArea img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            vertical-align: middle;
            margin-inline-end: 8px;
        }
        #gameContainer {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 4 / 3;
        }
        #gameContainer { position: relative; }
        #gameContainer embed {
            width: 100%;
            height: 100%;
        }
        #settingsBtn {
            background: #333;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-inline-start: 8px;
        }
        #settingsPanel {
            display: none;
            position: fixed;
            inset: 64px 16px auto auto;
            width: min(320px, calc(100% - 32px));
            background: #202020;
            border: 1px solid #666;
            border-radius: 8px;
            color: #fff;
            padding: 16px;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        #settingsPanel.open { display: block; }
        #settingsPanel label { display: block; margin: 12px 0 4px; }
        #settingsPanel select, #settingsPanel input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
        }
        #settingsPanel .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 14px;
        }
    </style>

    <!-- إعداد جودة Ruffle قبل تحميل السكربت -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            quality: "medium",
            letterbox: "on",
            backgroundColor: "#000000",
            autoplay: "on",
            unmuteOverlay: "visible",
            splashScreen: true,
            maxExecutionDuration: 15
        };
    </script>
    <script src="ruffle/ruffle.js"></script>

    <script type="module" src="firebase/firebase.js"></script>
    <script type="module" src="firebase/save.js"></script>
    <script type="module" src="firebase/auth.js"></script>
</head>

<body>

    <div id="topbar">
        <div id="authArea">
            <button id="loginBtn">تسجيل الدخول بحساب جوجل</button>
        </div>
        <button id="settingsBtn" type="button">Setting</button>
    </div>

    <div id="settingsPanel" aria-hidden="true">
        <strong>Setting</strong>
        <label for="qualitySelect">الجودة</label>
        <select id="qualitySelect">
            <option value="low">Low - للأجهزة الضعيفة</option>
            <option value="medium">Medium - متوازن</option>
            <option value="high">High - للأجهزة القوية</option>
        </select>
        <label for="frameRateInput">الفريمات المستهدفة</label>
        <input id="frameRateInput" type="number" min="15" max="60" step="5" value="30">
        <div class="actions">
            <button id="closeSettings" type="button">إغلاق</button>
            <button id="saveSettings" type="button">حفظ</button>
        </div>
        <small>قد تحتاج بعض إعدادات Ruffle إلى إعادة تحميل الصفحة لتطبيقها بالكامل.</small>
    </div>

    <div id="gameContainer">
        <embed
            id="gamePlayer"
            src="battlepanic.swf"
            width="1200"
            height="900"
            quality="medium"
            allowscriptaccess="always">
    </div>

    <script type="module">
        import { loginWithGoogle, logout, watchAuthState } from "./firebase/auth.js";

        const authArea = document.getElementById("authArea");
        let storedSettings = {};
        try {
            storedSettings = JSON.parse(localStorage.getItem("battlepanic_settings") || "{}");
        } catch (_) {
            storedSettings = {};
        }
        const qualitySelect = document.getElementById("qualitySelect");
        const frameRateInput = document.getElementById("frameRateInput");
        const settingsPanel = document.getElementById("settingsPanel");
        const gamePlayer = document.getElementById("gamePlayer");

        qualitySelect.value = storedSettings.quality || "medium";
        frameRateInput.value = storedSettings.frameRate || 30;
        gamePlayer.setAttribute("quality", qualitySelect.value);

        function openSettings() {
            settingsPanel.classList.add("open");
            settingsPanel.setAttribute("aria-hidden", "false");
        }

        document.getElementById("settingsBtn").onclick = () => {
            settingsPanel.classList.toggle("open");
            settingsPanel.setAttribute("aria-hidden", settingsPanel.classList.contains("open") ? "false" : "true");
        };
        window.openSettings = openSettings;
        document.getElementById("closeSettings").onclick = () => settingsPanel.classList.remove("open");
        document.getElementById("saveSettings").onclick = () => {
            const settings = {
                quality: qualitySelect.value,
                frameRate: Number(frameRateInput.value) || 30
            };
            localStorage.setItem("battlepanic_settings", JSON.stringify(settings));
            gamePlayer.setAttribute("quality", settings.quality);
            window.RufflePlayer.config.quality = settings.quality;
            window.RufflePlayer.config.frameRate = settings.frameRate;
            settingsPanel.classList.remove("open");
        };


        function renderLoggedIn(user) {
            authArea.innerHTML = "";
            const img = document.createElement("img");
            img.src = user.photoURL || "";
            const name = document.createElement("span");
            name.textContent = user.displayName || user.email || "مستخدم";
            const out = document.createElement("button");
            out.textContent = "تسجيل الخروج";
            out.style.marginInlineStart = "10px";
            out.onclick = logout;
            authArea.append(img, name, out);
        }

        function renderLoggedOut() {
            authArea.innerHTML = "";
            const btn = document.createElement("button");
            btn.id = "loginBtn";
            btn.textContent = "تسجيل الدخول بحساب جوجل";
            btn.onclick = () => loginWithGoogle();
            authArea.appendChild(btn);
        }

        function notifyGame(methodName, arg) {
            try {
                const player = document.getElementById("gamePlayer");
                if (player && typeof player[methodName] === "function") {
                    arg === undefined ? player[methodName]() : player[methodName](arg);
                }
            } catch (e) {
                console.warn("Could not reach SWF method " + methodName, e);
            }
        }

        watchAuthState((user) => {
            if (user) {
                renderLoggedIn(user);
                notifyGame("onGoogleSignedIn", user.displayName || user.email || "Player");
            } else {
                renderLoggedOut();
                notifyGame("onGoogleSignedOut");
            }
        });

        // إتاحة تسجيل الدخول لملف الـ SWF عبر ExternalInterface
        window.loginWithGoogle = () => loginWithGoogle();
        window.googleLogin = window.loginWithGoogle;
    </script>

</body>
</html>
