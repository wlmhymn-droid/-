<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Panic</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxqcSLNDfHlp2ifT_uAo40NmO7aLg_SKI",
            authDomain: "battlepanic-5ce76.firebaseapp.com",
            projectId: "battlepanic-5ce76",
            storageBucket: "battlepanic-5ce76.firebasestorage.app",
            messagingSenderId: "667500049822",
            appId: "1:667500049822:web:0b786319ea0206e3efd28f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // مزامنة الحفظ السحابي تلقائياً عند فتح اللعبة
        async function syncCloudSave() {
            try {
                const doc = await db.collection("player_saves").doc("default_user").get();
                if (doc.exists) {
                    const saveData = doc.data().data;
                    for (const key in saveData) {
                        localStorage.setItem(key, saveData[key]);
                    }
                }
            } catch(e) { console.log(e); }
        }

        // رفع أي تغيير في الحفظ تلقائياً إلى Firebase
        function autoUploadSave() {
            const saveData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes("battlePanic") || key.includes("sol") || key.includes("guest")) {
                    saveData[key] = localStorage.getItem(key);
                }
            }
            if (Object.keys(saveData).length > 0) {
                db.collection("player_saves").doc("default_user").set({
                    data: saveData,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => console.error(err));
            }
        }

        // الاستماع للتغيرات للحفظ تلقائياً
        window.addEventListener("beforeunload", autoUploadSave);
        setInterval(autoUploadSave, 15000); // حفظ تلقائي كل 15 ثانية

        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", async (event) => {
            await syncCloudSave();
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("container");
            container.appendChild(player);
            player.load("battlepanic.swf");
        });
    </script>
</body>
</html>
