<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Panic Offline & Cloud</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #container { width: 100%; height: 85vh; max-width: 1000px; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
        button { padding: 8px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="container"></div>
    <div class="controls">
        <button onclick="uploadSaveToCloud()">رفع الحفظ للسحابة ☁️</button>
        <button onclick="downloadSaveFromCloud()">تنزيل الحفظ من السحابة 📥</button>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxqcSLNDfHlp2ifT_uAo40NmO7aLg_SKI",
            authDomain: "battlepanic-5ce76.firebaseapp.com",
            projectId: "battlepanic-5ce76",
            storageBucket: "battlepanic-5ce76.firebasestorage.app",
            messagingSenderId: "667500049822",
            appId: "1:667500049822:web:0b786319ea0206e3efd28f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("container");
            container.appendChild(player);
            player.load("battlepanic_offline.swf");
        });

        async function uploadSaveToCloud() {
            try {
                const saveData = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.includes("battlePanic") || key.includes("sol")) {
                        saveData[key] = localStorage.getItem(key);
                    }
                }
                await db.collection("player_saves").doc("default_user").set({
                    data: saveData,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("تم رفع ملف الحفظ بنجاح إلى Firebase!");
            } catch (error) {
                alert("خطأ أثناء الرفع: " + error.message);
            }
        }

        async function downloadSaveFromCloud() {
            try {
                const doc = await db.collection("player_saves").doc("default_user").get();
                if (doc.exists) {
                    const saveData = doc.data().data;
                    for (const key in saveData) {
                        localStorage.setItem(key, saveData[key]);
                    }
                    alert("تم استرجاع الحفظ! يرجى تحديث الصفحة.");
                    location.reload();
                } else {
                    alert("لا يوجد حفظ مخزن.");
                }
            } catch (error) {
                alert("خطأ أثناء التنزيل: " + error.message);
            }
        }
    </script>
</body>
</html>
