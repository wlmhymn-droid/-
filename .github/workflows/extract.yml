name: Auto Extract Full Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Tools & Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip git-lfs
          git lfs install

      - name: Track Large Files and FLA with Git LFS
        run: |
          git lfs track "*.zip"
          git lfs track "*.7z"
          git lfs track "*.00*"
          git lfs track "*.fla"

      - name: Extract Full Source Zip
        run: |
          [ -f full_source.zip ] && unzip -o full_source.zip || true
          [ -f full_source.7z.001 ] && 7z x full_source.7z.001 -y || true

      - name: Commit and Push All Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs track "*.fla"
          git add .gitattributes
          git add .
          git commit -m "Upload and track large fla files with Git LFS" || exit 0
          git push
